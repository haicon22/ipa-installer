name: Deploy IPA Installer PWA

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - 'tests/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Automated Binary IPA Parser Tests
        run: node tests/test-pwa-parsers.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pwa'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
