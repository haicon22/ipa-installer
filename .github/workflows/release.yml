name: Release IPA Installer Ecosystem

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Phiên bản phát hành (ví dụ: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Run PWA Binary Parser Tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test-pwa-parsers.mjs

      - name: Run ZSign C++ & OpenSSL Signing Tests
        run: |
          cd ios/Packages/ZSignKit
          swift test -v

      - name: Generate Xcode Project & Build Native iOS App (iOS 15.0+)
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd ios && xcodegen generate && cd ..
          xcodebuild build \
            -project ios/IPAInstaller.xcodeproj \
            -scheme IPAInstaller \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build/DerivedData \
            -clonedSourcePackagesDirPath ios/SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Release Assets (Unsigned IPA + Offline PWA + Termux Bootstrap)
        run: |
          mkdir -p release_dist ios/build/package/Payload
          cp -R "ios/build/DerivedData/Build/Products/Release-iphoneos/IPAInstaller.app" ios/build/package/Payload/
          (cd ios/build/package && zip -qry ../../../release_dist/IPAInstaller-unsigned.ipa Payload)
          (cd pwa && zip -qry ../release_dist/IPAInstaller-PWA-Offline.zip .)
          tar -czf release_dist/IPAInstaller-Termux-Bootstrap.tar.gz termux-bootstrap/
          ls -lh release_dist/

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == "main" || -z "$TAG" ]]; then
            TAG="${{ inputs.tag_name || 'v1.0.0' }}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_dist/* --clobber
          else
            gh release create "$TAG" release_dist/* \
              --title "IPA Installer $TAG (Web PWA + Native iOS 15+ + Termux Bootstrap)" \
              --notes "Bản phát hành tự động từ GitHub Actions (Chi phí 0 đồng): gồm IPAInstaller-unsigned.ipa (SwiftUI + ZSign C++), gói Web PWA Offline và bộ công cụ Android Termux Bootstrap."
          fi
